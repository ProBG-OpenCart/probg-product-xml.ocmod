name: Publish v2.1.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.1.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          if git rev-parse "v2.1.3" >/dev/null 2>&1; then
            echo "Tag v2.1.3 already exists."
          else
            git tag "v2.1.3" "2f8be2df6eb1265655d5d1f26580d9fe6aae7ab8"
            git push origin "v2.1.3"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v2.1.3" >/dev/null 2>&1; then
            gh release upload "v2.1.3" "dist/probg-product-xml-2.1.3.ocmod.zip" --clobber
          else
            gh release create "v2.1.3" \
              "dist/probg-product-xml-2.1.3.ocmod.zip" \
              --title "ProBG Product XML Generator 2.1.3" \
              --notes "## ProBG Product XML Generator 2.1.3

- Added export of the product SEO URL keyword as \`seo_url\`.
- SEO keyword is resolved for the current store and language from OpenCart's \`seo_url\` data.
- The full product URL remains available separately in the \`url\` field.

### Installation
Upload \`probg-product-xml-2.1.3.ocmod.zip\` through **Extensions → Installer** and refresh the OCMOD modifications cache."
          fi
